<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar</title>
    <link rel="stylesheet" href="./Css/estilos.css">
</head>

<body>
    <div class="container">
        <div class="box">
            <h1>Cadastro ou procurar jogos</h1>

            <form>
                <div class="input">
                    <label for="nome">Nome do jogo</label>
                    <input type="text" />
                </div>

                <div class="input">
                    <label for="email">ID do nome do jogador</label>
                    <input type="email" />
                </div>

                <div class="input">
                    <label for="senha">Senha da conta</label>
                    <input type="password" />
                </div>
                <div class="input">
                    <label for="telefone">Telefone da empresa</label>
                    <input type="number" />
                </div>

                
                
                <div class="input"> 
                    <label for="lista">lista de jogos</label>
                    <select name="lista" id="lista">
                        <option value="lista">Jogos</option>
                        <option name="lista" id="lista">Marvel Rivals</option>
                        <option name="lista" id="lista">God of War</option>
                        <option name="lista" id="lista">crash</option>
                        <option name="lista" id="lista">Sonic</option>
                        <option name="lista" id="lista">Mario</option>
                        <option name="lista" id="lista">Spider man</option>
                        <option name="lista" id="lista">Fortnite</option>
                    </select>
                </div>
                <div class="input">
                <label for="data" class="data">Data</label>
                <input type="date" />
                </div>

            </form>
        </div>
        
        

</body>
</html>
